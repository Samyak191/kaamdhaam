name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12-alpine3.24
        env:
          POSTGRES_DB: kaamdham_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d kaamdham_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:isolated_ci_password@127.0.0.1:5432/kaamdham_test?schema=public
      TEST_DATABASE_URL: postgresql://test:isolated_ci_password@127.0.0.1:5432/kaamdham_test?schema=public
      SUPABASE_ISSUER: https://example.supabase.co/auth/v1
      SUPABASE_AUDIENCE: authenticated
      SUPABASE_JWKS_URL: https://example.supabase.co/auth/v1/.well-known/jwks.json
      CORS_ORIGINS: http://localhost:5173
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:demo
      - run: npm run build
        env:
          VITE_APP_MODE: demo
      - run: npm audit --omit=dev --audit-level=high

  release_tooling:
    # Lints both workflows and the EC2 release scripts, and runs their unit tests, on a hosted
    # runner. Nothing here touches the self-hosted runner or the live host.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history: the migration guard diffs the whole migration history below.
          fetch-depth: 0
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: ShellCheck release scripts
        run: shellcheck --severity=warning deploy/scripts/*.sh
      - name: Release tooling tests
        run: python3 -m unittest discover -s deploy/scripts -p 'test_*.py' -v
      - name: Migration guard accepts the committed migration history
        run: |
          set -Eeuo pipefail
          # Every migration in history must classify as additive or the live release will stop
          # and ask for a manual review; surface that in CI rather than at deploy time.
          # Exit 3 (destructive, unreviewed) is a warning here; exit 2 (tampered history) fails CI.
          rc=0
          python3 deploy/scripts/migration-guard.py --repo . --previous "$(git rev-list --max-parents=0 HEAD | tail -n1)" --release "$(git rev-parse HEAD)" --reviewed false || rc=$?
          if [[ "$rc" -eq 3 ]]; then
            echo '::warning::This commit adds a destructive migration; automatic deployment will stop and require a manual dispatch with destructive_migrations_reviewed=true.'
          elif [[ "$rc" -ne 0 ]]; then
            exit "$rc"
          fi
      - name: Compose release configuration removes build contexts
        env:
          RELEASE_GIT_SHA: 0000000000000000000000000000000000000000
          STAGING_HOST: example.invalid
          BACKEND_ENV_FILE: /dev/null
        run: |
          set -Eeuo pipefail
          printf 'POSTGRES_DB=ci\nPOSTGRES_USER=ci\nPOSTGRES_PASSWORD=ci\nVITE_SUPABASE_URL=https://example.invalid\nVITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci\nSTAGING_HOST=example.invalid\n' > "$RUNNER_TEMP/compose.env"
          docker compose --env-file "$RUNNER_TEMP/compose.env" -f deploy/compose.yaml -f deploy/staging.compose.yaml -f deploy/ghcr.compose.yaml -p ci-config-check config --format json \
            | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; assert all("build" not in s[n] for n in ("migrate","backend","web")), "build contexts leaked"; print("ok: no build contexts for", sorted(s))'

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, release_tooling]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public live-build configuration
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test "$SUPABASE_URL" = 'https://tvynmgcbyathsgguezye.supabase.co'
          test "$SUPABASE_KEY" != '' && [[ "$SUPABASE_KEY" == sb_publishable_* ]]
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish migration image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: migrate
          push: true
          tags: ghcr.io/samyak191/kaamdhaam-migrate:${{ github.sha }}
          build-args: |
            RELEASE_GIT_SHA=${{ github.sha }}
      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: true
          tags: ghcr.io/samyak191/kaamdhaam-backend:${{ github.sha }}
          build-args: |
            RELEASE_GIT_SHA=${{ github.sha }}
      - name: Publish live frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ghcr.io/samyak191/kaamdhaam-web:${{ github.sha }}
          build-args: |
            RELEASE_GIT_SHA=${{ github.sha }}
            VITE_APP_MODE=live
            VITE_API_BASE_URL=/v1
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
