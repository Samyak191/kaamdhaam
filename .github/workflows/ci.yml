name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12-alpine3.24
        env:
          POSTGRES_DB: kaamdham_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d kaamdham_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:isolated_ci_password@127.0.0.1:5432/kaamdham_test?schema=public
      TEST_DATABASE_URL: postgresql://test:isolated_ci_password@127.0.0.1:5432/kaamdham_test?schema=public
      SUPABASE_ISSUER: https://example.supabase.co/auth/v1
      SUPABASE_AUDIENCE: authenticated
      SUPABASE_JWKS_URL: https://example.supabase.co/auth/v1/.well-known/jwks.json
      CORS_ORIGINS: http://localhost:5173
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:demo
      - run: npm run build
        env:
          VITE_APP_MODE: demo
      - run: npm audit --omit=dev --audit-level=high

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public live-build configuration
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test "$SUPABASE_URL" = 'https://tvynmgcbyathsgguezye.supabase.co'
          test "$SUPABASE_KEY" != '' && [[ "$SUPABASE_KEY" == sb_publishable_* ]]
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish migration image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: migrate
          push: true
          tags: ghcr.io/samyak191/kaamdhaam-migrate:${{ github.sha }}
          build-args: |
            RELEASE_GIT_SHA=${{ github.sha }}
      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: true
          tags: ghcr.io/samyak191/kaamdhaam-backend:${{ github.sha }}
          build-args: |
            RELEASE_GIT_SHA=${{ github.sha }}
      - name: Publish live frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ghcr.io/samyak191/kaamdhaam-web:${{ github.sha }}
          build-args: |
            RELEASE_GIT_SHA=${{ github.sha }}
            VITE_APP_MODE=live
            VITE_API_BASE_URL=/v1
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
