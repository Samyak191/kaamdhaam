services:
  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    environment:
      STAGING_HOST: ${STAGING_HOST:?Set the approved staging hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [private]

volumes:
  caddy_data:
  caddy_config:
