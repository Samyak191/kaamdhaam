name: kaamdham-beta
services:
  db:
    image: postgres:17.12-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [private]

  migrate:
    build:
      context: ../backend
      target: migrate
    env_file: ${BACKEND_ENV_FILE:-./backend.env}
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    restart: "no"

  backend:
    build:
      context: ../backend
      target: runtime
      args:
        RELEASE_GIT_SHA: ${RELEASE_GIT_SHA:-unknown}
    env_file: ${BACKEND_ENV_FILE:-./backend.env}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private]

  web:
    build:
      context: ..
      target: runtime
      args:
        RELEASE_GIT_SHA: ${RELEASE_GIT_SHA:-unknown}
        VITE_APP_MODE: live
        VITE_API_BASE_URL: /v1
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?Set VITE_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [private]

networks:
  private:
volumes:
  postgres_data:
